# /etc/nginx/sites-available/control.dkz12345.com
# Then: ln -sf ../sites-available/control.dkz12345.com /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx && certbot --nginx -d control.dkz12345.com
server {
    listen 80;
    server_name control.dkz12345.com;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    # Long-lived WebSocket from the Mac agent (it pings every 20 s).
    location = /agent {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0a0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ebe4d6" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
<title>Orbit</title>
</head>
<body class="is-loading" data-link="unknown">
<div class="backdrop" aria-hidden="true"></div>

<header class="topbar">
  <div class="station">
    <span class="beacon" id="beacon" data-link="unknown"></span>
    <div class="station-text">
      <h1 id="host-name">正在连接…</h1>
      <p class="readout" id="link-text">等待 Mac 上线</p>
    </div>
  </div>
  <div class="topbar-side">
    <span class="chip readout" id="battery" hidden></span>
    <button class="icon-button" id="logout" type="button" aria-label="退出登录">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4H18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3.5M10 16l4-4-4-4M14 12H4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<p class="banner" id="offline-banner" role="status" hidden></p>

<main class="deck">
  <section class="grid" aria-label="控制中心">
    <div class="tile cluster">
      <button class="row-toggle" type="button" data-toggle="wifi" aria-pressed="false">
        <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.6 9.4a13.4 13.4 0 0 1 18.8 0M5.9 12.8a8.7 8.7 0 0 1 12.2 0M9.2 16.1a4 4 0 0 1 5.6 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="19.2" r="1.45" fill="currentColor"/></svg></span>
        <span class="row-text"><span class="label">Wi-Fi</span><span class="sub" data-sub></span></span>
      </button>
      <button class="row-toggle" type="button" data-toggle="bluetooth" aria-pressed="false">
        <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="row-text"><span class="label">蓝牙</span><span class="sub" data-sub></span></span>
      </button>
      <button class="row-toggle" type="button" data-toggle="proxy" aria-pressed="false">
        <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.8 12h16.4M12 3.8c2.2 2.3 3.3 5 3.3 8.2s-1.1 5.9-3.3 8.2c-2.2-2.3-3.3-5-3.3-8.2s1.1-5.9 3.3-8.2z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg></span>
        <span class="row-text"><span class="label">系统代理</span><span class="sub" data-sub></span></span>
      </button>
    </div>

    <div class="tile media">
      <p class="tile-title">媒体</p>
      <div class="media-buttons">
        <button class="media-button" type="button" data-media="prev" aria-label="上一首">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M18 6.6v10.8L9.6 12z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        </button>
        <button class="media-button play" type="button" data-media="play" aria-label="播放或暂停">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 6.4v11.2L12.4 12z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M15.8 6.6v10.8M19.6 6.6v10.8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
        </button>
        <button class="media-button" type="button" data-media="next" aria-label="下一首">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 6v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M6 6.6v10.8L14.4 12z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="tile-note" id="media-note"></p>
    </div>

    <button class="tile mini" type="button" data-toggle="dark" aria-pressed="false">
      <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 14.7A7.7 7.7 0 1 1 9.3 4.6a6.2 6.2 0 0 0 10.1 10.1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg></span>
      <span class="label">深色</span>
    </button>
    <button class="tile mini" type="button" data-toggle="nightShift" aria-pressed="false">
      <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v2.3M5.4 7.4l1.6 1.6M18.6 7.4 17 9M3.5 16h17M7 16a5 5 0 0 1 10 0M7 19.6h10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
      <span class="label">夜览</span>
    </button>
    <button class="tile mini" type="button" data-toggle="stageManager" aria-pressed="false">
      <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.6" y="5" width="11.8" height="14" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3.8 7.6v8.8M6 6.4v11.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
      <span class="label">台前调度</span>
    </button>
    <button class="tile mini" type="button" data-toggle="mute" aria-pressed="false">
      <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.4h3.2L12 5.5v13l-4.8-3.9H4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M15.8 9.4l5 5M20.8 9.4l-5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
      <span class="label">静音</span>
    </button>

    <div class="tile fader-tile" id="brightness-tile" hidden>
      <div class="fader-head"><span class="tile-title">亮度</span><span class="readout" id="brightness-name"></span></div>
      <div class="fader-stack" id="brightness-faders"></div>
    </div>

    <div class="tile fader-tile" id="volume-tile">
      <div class="fader-head">
        <span class="tile-title">声音</span>
        <button class="chip chip-button" id="output-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11v2M8 8v8M12 5v14M16 8v8M20 11v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span id="output-name">输出设备</span>
        </button>
      </div>
      <label class="fader" id="volume-fader">
        <span class="fader-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.4h3.2L12 5.5v13l-4.8-3.9H4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M15.4 9a4.2 4.2 0 0 1 0 6M18.2 6.3a8 8 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
        <input type="range" min="0" max="100" step="1" aria-label="音量">
        <span class="fader-value readout"></span>
      </label>
      <p class="tile-note" id="volume-note" hidden></p>
    </div>
  </section>

  <section class="tile apps-tile" aria-labelledby="running-title">
    <div class="section-head"><h2 id="running-title">正在运行</h2><span class="readout" id="running-count"></span></div>
    <ul class="app-list" id="running"></ul>
  </section>

  <section class="tile apps-tile" aria-labelledby="launch-title">
    <div class="section-head"><h2 id="launch-title">打开应用</h2></div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M16 16l4.4 4.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="搜索已安装的应用" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </label>
    <div class="favorites" id="favorites"></div>
    <ul class="app-list" id="results"></ul>
  </section>
</main>

<template id="screen-fader">
  <div class="fader-block">
    <p class="fader-caption readout"></p>
    <label class="fader">
      <span class="fader-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.7" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 3.2v2M12 18.8v2M3.2 12h2M18.8 12h2M5.8 5.8l1.4 1.4M16.8 16.8l1.4 1.4M5.8 18.2l1.4-1.4M16.8 7.2l1.4-1.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
      <input type="range" min="0" max="100" step="1" aria-label="亮度">
      <span class="fader-value readout"></span>
    </label>
  </div>
</template>

<template id="icon-more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18.5" cy="12" r="1.7" fill="currentColor"/></svg></template>
<template id="icon-star"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.6L12 16.8l-5.1 2.6 1-5.6-4.1-4 5.7-.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></template>

<dialog class="sheet" id="sheet">
  <form method="dialog" class="sheet-body">
    <p class="sheet-title" id="sheet-title"></p>
    <p class="sheet-message" id="sheet-message"></p>
    <div class="sheet-options" id="sheet-options"></div>
    <button class="sheet-cancel" value="cancel">取消</button>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
